<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YoloCoder</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<main>
  <section id="sidebar">
    <header id="chat-header">
      <div id="brand-block">
        <span id="brand"><span class="brand-face">[^_^]</span> YoloCoder</span>
        <div id="folder-indicator"></div>
      </div>
      <button id="btn-recover" type="button" hidden>Restart</button>
      <button id="btn-collapse" type="button" title="Collapse chat">&laquo;</button>
    </header>
    <div id="progress" hidden></div>
    <div id="chat-log"></div>
    <button id="btn-latest" type="button" hidden>&#9660; latest</button>
    <div id="pending-images" hidden></div>
    <form id="chat-form">
      <span id="chat-prompt" aria-hidden="true">&#10095;</span>
      <textarea id="chat-input" placeholder="ask for a change &middot; paste a screenshot to show it" rows="2"></textarea>
      <button id="chat-send" type="submit" title="Send" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </form>
    <div id="input-footer">
      <select id="model-select" title="Model"></select>
      <span id="composer-hint">Shift+Enter for new line</span>
    </div>
  </section>
  <button id="btn-expand" type="button" title="Show chat" hidden>[^_^]</button>
  <section id="preview">
    <iframe id="app-frame" src="about:blank" title="Your app"></iframe>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
