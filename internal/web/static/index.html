<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YoloCoder</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<main>
  <section id="sidebar">
    <header id="chat-header">
      <div id="brand-block">
        <span id="brand">[^_^] YoloCoder</span>
        <div id="folder-indicator"></div>
      </div>
      <button id="btn-recover" type="button" hidden>Restart</button>
      <button id="btn-collapse" type="button" title="Collapse chat">&laquo;</button>
    </header>
    <div id="chat-log"></div>
    <div id="pending-images" hidden></div>
    <form id="chat-form">
      <textarea id="chat-input" placeholder="Ask for a change... (paste a screenshot to show it)" rows="2"></textarea>
      <button id="chat-send" type="submit">Send</button>
    </form>
    <div id="input-footer">
      <select id="model-select" title="Model"></select>
    </div>
  </section>
  <button id="btn-expand" type="button" title="Show chat" hidden>[^_^]</button>
  <section id="preview">
    <iframe id="app-frame" src="about:blank" title="Your app"></iframe>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
