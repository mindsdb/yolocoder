<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YoloCoder</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<main>
  <section id="sidebar">
    <header id="chat-header">
      <span id="brand">[^_^] YoloCoder</span>
      <span id="process-state" class="pill pill-stopped">stopped</span>
      <button id="btn-collapse" type="button" title="Collapse chat">&laquo;</button>
    </header>
    <div id="chat-log"></div>
    <details id="agent-console">
      <summary>Agent activity</summary>
      <div id="agent-console-log"></div>
    </details>
    <details id="server-console">
      <summary>Backend logs</summary>
      <div id="server-console-log"></div>
    </details>
    <div id="busy-indicator" hidden><span class="spinner"></span><span id="busy-text">Working...</span></div>
    <div id="review-note" hidden>Watching for errors...</div>
    <form id="chat-form">
      <textarea id="chat-input" placeholder="Ask for a change..." rows="2"></textarea>
      <button id="chat-send" type="submit">Send</button>
    </form>
  </section>
  <button id="btn-expand" type="button" title="Show chat" hidden>[^_^]</button>
  <section id="preview">
    <iframe id="app-frame" src="about:blank" title="Your app"></iframe>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
